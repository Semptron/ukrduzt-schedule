name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all modules
        working-directory: backend
        run: python -m compileall -q .

      - name: Run tests with coverage
        working-directory: backend
        # Coverage is written to backend/coverage.xml and an html report.
        # The XML is small and useful for trend graphs; the HTML is uploaded
        # as an artifact for browsing failures.
        run: |
          pip install --quiet pytest-cov
          python -m pytest tests/ -v --tb=short \
            --cov=. --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: backend/htmlcov/
          if-no-files-found: ignore
          retention-days: 7
