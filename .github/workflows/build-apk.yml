name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Cache Gradle and pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ukrduzt_app/.dart_tool
            ukrduzt_app/build
          key: ${{ runner.os }}-gradle-pub-${{ hashFiles('flutter/**', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pub-

      - name: Create Flutter project and copy app files
        run: |
          flutter create --org ua.edu.kart.schedule ukrduzt_app
          rm -f ukrduzt_app/test/widget_test.dart
          rm -rf ukrduzt_app/lib/*
          cp -r flutter/. ukrduzt_app/lib/

      - name: Configure pubspec.yaml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("ukrduzt_app/pubspec.yaml")
          snippet = Path("flutter/pubspec_dependencies_snippet.txt").read_text(encoding="utf-8")
          text = pubspec.read_text(encoding="utf-8")

          deps = []
          for line in snippet.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("dependencies:") or stripped.startswith("flutter:"):
                  continue
              if stripped.startswith("sdk:"):
                  continue
              if line.startswith("  "):
                  deps.append(line.rstrip("\n"))

          anchor = "  cupertino_icons: ^1.0.8\n"
          insert_after = anchor if anchor in text else "dependencies:\n"
          for line in deps:
              name = line.split(":", 1)[0].strip()
              if f"  {name}:" in text:
                  continue
              text = text.replace(insert_after, insert_after + line + "\n", 1)
              insert_after = line + "\n"

          pubspec.write_text(text, encoding="utf-8")
          PY

      - name: Ensure INTERNET permission in AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("ukrduzt_app/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          perm = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "android.permission.INTERNET" not in text:
              if re.search(r"<manifest\b[^>]*>\s*\n", text):
                  text = re.sub(r"(<manifest\b[^>]*>\s*\n)", r"\1" + perm, text, count=1)
              else:
                  text = re.sub(r"(<application\b)", perm + r"\1", text, count=1)

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Decode signing keystore and configure Gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty; building with default signing config."
            exit 0
          fi

          mkdir -p ukrduzt_app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > ukrduzt_app/android/app/keystore.jks

          cat > ukrduzt_app/android/key.properties <<EOF
          storeFile=app/keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_dir = Path("ukrduzt_app/android/app")
          gradle_groovy = app_dir / "build.gradle"
          gradle_kts = app_dir / "build.gradle.kts"

          if gradle_groovy.exists():
              text = gradle_groovy.read_text(encoding="utf-8")
              if "keystoreProperties" not in text:
                  props_block = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  text = re.sub(r"(android\s*\{)", props_block + r"\1", text, count=1)

              if "signingConfigs" not in text:
                  sc_block = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }
          """
                  text = re.sub(r"(buildTypes\s*\{)", sc_block + r"\1", text, count=1)

              if "signingConfig signingConfigs.release" not in text:
                  text = re.sub(
                      r"(release\s*\{[^}]*?)(\s*\})",
                      r"\1            signingConfig signingConfigs.release\2",
                      text,
                      count=1,
                      flags=re.DOTALL,
                  )

              gradle_groovy.write_text(text, encoding="utf-8")

          elif gradle_kts.exists():
              text = gradle_kts.read_text(encoding="utf-8")
              if "keystoreProperties" not in text:
                  import_line = "import java.util.Properties\nimport java.io.FileInputStream\n\n"
                  props_block = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          """
                  text = import_line + re.sub(r"(android\s*\{)", props_block + r"\1", text, count=1)

              if "signingConfigs" not in text:
                  sc_block = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      val storeFilePath = keystoreProperties.getProperty("storeFile")
                      storeFile = if (!storeFilePath.isNullOrBlank()) file(storeFilePath) else null
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }
          """
                  text = re.sub(r"(buildTypes\s*\{)", sc_block + r"\1", text, count=1)

              if 'signingConfig = signingConfigs.getByName("release")' not in text:
                  text = re.sub(
                      r'(getByName\("release"\)\s*\{[^}]*?)(\s*\})',
                      r'\1            signingConfig = signingConfigs.getByName("release")\2',
                      text,
                      count=1,
                      flags=re.DOTALL,
                  )

              gradle_kts.write_text(text, encoding="utf-8")
          else:
              raise FileNotFoundError("Neither build.gradle nor build.gradle.kts found in android/app")
          PY

      - name: Install packages, analyze and test
        working-directory: ukrduzt_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build release APK (split per ABI)
        working-directory: ukrduzt_app
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with commit SHA
        working-directory: ukrduzt_app
        run: |
          set -e
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          out_dir="build/app/outputs/flutter-apk"
          for apk in "$out_dir"/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            mv "$apk" "$out_dir/ukrduzt-${short}-${abi}.apk"
          done
          ls -la "$out_dir"/ukrduzt-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ukrduzt-schedule-apk-${{ github.sha }}
          path: ukrduzt_app/build/app/outputs/flutter-apk/ukrduzt-*.apk
          if-no-files-found: error
