      - name: Decode signing keystore and configure Gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty; building with default signing config."
            exit 0
          fi

          mkdir -p ukrduzt_app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > ukrduzt_app/android/app/keystore.jks

          if [ ! -s ukrduzt_app/android/app/keystore.jks ]; then
            echo "Decoded keystore.jks is empty; check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

          cat > ukrduzt_app/android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("ukrduzt_app/android/app/build.gradle")
          if not gradle.exists():
              raise FileNotFoundError("build.gradle not found")

          text = gradle.read_text(encoding="utf-8")

          def find_block(src: str, keyword: str, start_from: int = 0):
              m = re.search(rf"\b{re.escape(keyword)}\s*\{{", src[start_from:])
              if not m:
                  return None
              open_idx = start_from + m.end() - 1
              depth = 0
              for i in range(open_idx, len(src)):
                  ch = src[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return (start_from + m.start(), open_idx, i)
              return None

          if "def keystoreProperties =" not in text:
              props_code = (
                  'def keystoreProperties = new Properties()\n'
                  'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              android_blk = find_block(text, "android")
              if android_blk:
                  text = text[:android_blk[0]] + props_code + text[android_blk[0]:]

          release_cfg = (
              '        release {\n'
              '            keyAlias keystoreProperties["keyAlias"]\n'
              '            keyPassword keystoreProperties["keyPassword"]\n'
              '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
              '            storePassword keystoreProperties["storePassword"]\n'
              '        }\n'
          )

          android_blk = find_block(text, "android")
          if android_blk:
              _, a_open, a_close = android_blk
              sc_blk = find_block(text, "signingConfigs", a_open)
              if sc_blk and sc_blk[2] < a_close:
                  if "release" not in text[sc_blk[1]:sc_blk[2]]:
                      insert_pos = sc_blk[1] + 1
                      text = text[:insert_pos] + "\n" + release_cfg + text[insert_pos:]
              else:
                  bt_blk = find_block(text, "buildTypes", a_open)
                  sc_block_full = f"    signingConfigs {{\n{release_cfg}    }}\n\n"
                  if bt_blk and bt_blk[2] < a_close:
                      text = text[:bt_blk[0]] + sc_block_full + text[bt_blk[0]:]
                  else:
                      text = text[:a_close] + "\n" + sc_block_full + text[a_close:]

          android_blk = find_block(text, "android")
          if android_blk:
              _, a_open, a_close = android_blk
              bt_blk = find_block(text, "buildTypes", a_open)
              if bt_blk and bt_blk[2] < a_close:
                  rel_blk = find_block(text, "release", bt_blk[1])
                  if rel_blk and rel_blk[2] < bt_blk[2]:
                      rel_body = text[rel_blk[1] + 1:rel_blk[2]]
                      if "signingConfigs.release" not in rel_body:
                          if re.search(r"\bsigningConfig\b[^\r\n]*", rel_body):
                              rel_body_new = re.sub(
                                  r"\bsigningConfig\b[^\r\n]*",
                                  "signingConfig signingConfigs.release",
                                  rel_body,
                                  count=1,
                              )
                          else:
                              rel_body_new = "\n            signingConfig signingConfigs.release" + rel_body
                          text = text[:rel_blk[1] + 1] + rel_body_new + text[rel_blk[2]:]

          gradle.write_text(text, encoding="utf-8")
          PY
