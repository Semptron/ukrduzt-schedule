name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Cache Gradle and pub
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ukrduzt_app/.dart_tool
            ukrduzt_app/build
          key: ${{ runner.os }}-gradle-pub-${{ hashFiles('flutter/**', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pub-

      - name: Create Flutter project and copy app files
        run: |
          set -e
          flutter create --org ua.edu.kart.schedule ukrduzt_app
          (cd ukrduzt_app && flutter pub add share_plus)
          rm -rf ukrduzt_app/test/*
          rm -rf ukrduzt_app/lib/*
          cp -r flutter/. ukrduzt_app/lib/
          mkdir -p ukrduzt_app/test
          cat > ukrduzt_app/test/app_smoke_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:ukrduzt_app/main.dart';

          void main() {
            testWidgets('App widget builds without crashing', (WidgetTester tester) async {
              await tester.pumpWidget(const UkrduztCorrespondenceApp());
              expect(find.byType(UkrduztCorrespondenceApp), findsOneWidget);
            });
          }
          EOF

      - name: Configure pubspec.yaml
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("ukrduzt_app/pubspec.yaml")
          snippet_path = Path("flutter/pubspec_dependencies_snippet.txt")

          text = pubspec.read_text(encoding="utf-8")
          deps = []

          if snippet_path.exists():
              snippet = snippet_path.read_text(encoding="utf-8")
              for line in snippet.splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("dependencies:") or stripped.startswith("flutter:"):
                      continue
                  if stripped.startswith("sdk:"):
                      continue
                  if line.startswith("  "):
                      deps.append(line.rstrip("\n"))

          if not any(d.split(":", 1)[0].strip() == "share_plus" for d in deps):
              deps.append("  share_plus: ^10.1.4")

          anchor = "  cupertino_icons: ^1.0.8\n"
          insert_after = anchor if anchor in text else "dependencies:\n"
          for line in deps:
              name = line.split(":", 1)[0].strip()
              if f"  {name}:" in text:
                  continue
              text = text.replace(insert_after, insert_after + line + "\n", 1)
              insert_after = line + "\n"

          pubspec.write_text(text, encoding="utf-8")
          PY

      - name: Ensure INTERNET permission in AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("ukrduzt_app/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          perm = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "android.permission.INTERNET" not in text:
              if re.search(r"<manifest\b[^>]*>\s*\n", text):
                  text = re.sub(r"(<manifest\b[^>]*>\s*\n)", r"\1" + perm, text, count=1)
              else:
                  text = re.sub(r"(<application\b)", perm + r"\1", text, count=1)

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Decode signing keystore and configure Gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is empty; building with default signing config."
            exit 0
          fi

          mkdir -p ukrduzt_app/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > ukrduzt_app/android/app/keystore.jks

          if [ ! -s ukrduzt_app/android/app/keystore.jks ]; then
            echo "Decoded keystore.jks is empty; check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

          cat > ukrduzt_app/android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("ukrduzt_app/android/app/build.gradle")
          if not gradle.exists():
              raise FileNotFoundError("build.gradle not found")

          text = gradle.read_text(encoding="utf-8")

          def find_block(src: str, keyword: str, start_from: int = 0):
              m = re.search(rf"\b{re.escape(keyword)}\s*\{{", src[start_from:])
              if not m:
                  return None
              open_idx = start_from + m.end() - 1
              depth = 0
              for i in range(open_idx, len(src)):
                  ch = src[i]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return (start_from + m.start(), open_idx, i)
              return None

          if "def keystoreProperties =" not in text:
              props_code = (
                  'def keystoreProperties = new Properties()\n'
                  'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) {\n'
                  '    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n'
                  '}\n\n'
              )
              android_blk = find_block(text, "android")
              if android_blk:
                  text = text[:android_blk[0]] + props_code + text[android_blk[0]:]

          release_cfg = (
              '        release {\n'
              '            keyAlias keystoreProperties["keyAlias"]\n'
              '            keyPassword keystoreProperties["keyPassword"]\n'
              '            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\n'
              '            storePassword keystoreProperties["storePassword"]\n'
              '        }\n'
          )

          android_blk = find_block(text, "android")
          if android_blk:
              _, a_open, a_close = android_blk
              sc_blk = find_block(text, "signingConfigs", a_open)
              if sc_blk and sc_blk[2] < a_close:
                  if "release" not in text[sc_blk[1]:sc_blk[2]]:
                      insert_pos = sc_blk[1] + 1
                      text = text[:insert_pos] + "\n" + release_cfg + text[insert_pos:]
              else:
                  bt_blk = find_block(text, "buildTypes", a_open)
                  sc_block_full = f"    signingConfigs {{\n{release_cfg}    }}\n\n"
                  if bt_blk and bt_blk[2] < a_close:
                      text = text[:bt_blk[0]] + sc_block_full + text[bt_blk[0]:]
                  else:
                      text = text[:a_close] + "\n" + sc_block_full + text[a_close:]

          android_blk = find_block(text, "android")
          if android_blk:
              _, a_open, a_close = android_blk
              bt_blk = find_block(text, "buildTypes", a_open)
              if bt_blk and bt_blk[2] < a_close:
                  rel_blk = find_block(text, "release", bt_blk[1])
                  if rel_blk and rel_blk[2] < bt_blk[2]:
                      rel_body = text[rel_blk[1] + 1:rel_blk[2]]
                      if "signingConfigs.release" not in rel_body:
                          if re.search(r"\bsigningConfig\b[^\r\n]*", rel_body):
                              rel_body_new = re.sub(
                                  r"\bsigningConfig\b[^\r\n]*",
                                  "signingConfig signingConfigs.release",
                                  rel_body,
                                  count=1,
                              )
                          else:
                              rel_body_new = "\n            signingConfig signingConfigs.release" + rel_body
                          text = text[:rel_blk[1] + 1] + rel_body_new + text[rel_blk[2]:]

          gradle.write_text(text, encoding="utf-8")
          PY

      - name: Install packages, analyze and test
        working-directory: ukrduzt_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build release APK (split per ABI)
        working-directory: ukrduzt_app
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with commit SHA
        working-directory: ukrduzt_app
        run: |
          set -e
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          out_dir="build/app/outputs/flutter-apk"
          for apk in "$out_dir"/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            mv "$apk" "$out_dir/ukrduzt-${short}-${abi}.apk"
          done
          ls -la "$out_dir"/ukrduzt-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ukrduzt-schedule-apk-${{ github.sha }}
          path: ukrduzt_app/build/app/outputs/flutter-apk/ukrduzt-*.apk
          if-no-files-found: error
