name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Cancel a previous run of the same branch when a new push lands — saves CI
# minutes and avoids publishing a stale APK.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the source; it never pushes back to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned version for reproducible builds. Bump intentionally.
          flutter-version: '3.24.5'
          cache: true

      - name: Cache Gradle and pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ukrduzt_app/.dart_tool
            ukrduzt_app/build
          key: ${{ runner.os }}-gradle-pub-${{ hashFiles('flutter/**', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pub-

      - name: Create Flutter project and copy app files
        run: |
          flutter create --org ua.edu.kart.schedule ukrduzt_app
          rm -f ukrduzt_app/test/widget_test.dart
          rm -rf ukrduzt_app/lib/*
          cp -r flutter/. ukrduzt_app/lib/

      - name: Configure pubspec.yaml
        run: |
          python3 -c '
          from pathlib import Path
          pubspec = Path("ukrduzt_app/pubspec.yaml")
          snippet = Path("flutter/pubspec_dependencies_snippet.txt").read_text(encoding="utf-8")
          text = pubspec.read_text(encoding="utf-8")
          # Pull only the real third-party deps from the snippet: lines that are
          # indented ("  name: ...") and are NOT the Flutter SDK entry.
          deps = []
          for line in snippet.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("dependencies:") or stripped.startswith("flutter:"):
                  continue
              if stripped.startswith("sdk:"):
                  continue
              if line.startswith("  "):
                  deps.append(line.rstrip("\n"))
          anchor = "  cupertino_icons: ^1.0.8\n"
          insert_after = anchor if anchor in text else "dependencies:\n"
          for line in deps:
              name = line.strip().split(":", 1)[0].strip()
              marker = f"  {name}:"
              if marker in text:
                  continue
              text = text.replace(insert_after, insert_after + line + "\n", 1)
              insert_after = line + "\n"
          pubspec.write_text(text, encoding="utf-8")
          '

      - name: Ensure INTERNET permission in AndroidManifest.xml
        run: |
          python3 -c '
          import re
          from pathlib import Path
          p = Path("ukrduzt_app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              perm = "    <uses-permission android:name=\"android.permission.INTERNET\" />\n"
              if re.search(r"<manifest\b[^>]*>\s*\n", text):
                  text = re.sub(r"(<manifest\b[^>]*>\s*\n)", r"\1" + perm, text, count=1)
              else:
                  text = re.sub(r"(<application\b)", perm + r"\1", text, count=1)
          p.write_text(text, encoding="utf-8")
          '

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p ukrduzt_app/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ukrduzt_app/android/app/keystore.jks
          cat > ukrduzt_app/android/key.properties <<EOF
          storeFile=app/keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Configure Gradle signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: ukrduzt_app
        run: |
          python3 -c '
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          if "keystoreProperties" not in text:
              block = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
              text = re.sub(r"(android\s*\{)", block + r"\1", text, count=1)
          if "signingConfigs" not in text:
              sc = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword keystoreProperties["storePassword"]
                  }
              }
          """
              text = re.sub(r"(buildTypes\s*\{)", sc + r"\1", text, count=1)
          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(
                  r"(release\s*\{[^}]*?)(\s*\})",
                  r"\1            signingConfig signingConfigs.release\2",
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
          gradle.write_text(text, encoding="utf-8")
          '

      - name: Install packages, analyze and test
        working-directory: ukrduzt_app
        run: |
          flutter pub get
          # Warnings must break the build — otherwise they are silently ignored.
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build release APK (split per ABI)
        working-directory: ukrduzt_app
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with commit SHA
        working-directory: ukrduzt_app
        run: |
          set -e
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          out_dir="build/app/outputs/flutter-apk"
          for apk in "$out_dir"/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            mv "$apk" "$out_dir/ukrduzt-${short}-${abi}.apk"
          done
          ls -la "$out_dir"/ukrduzt-*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ukrduzt-schedule-apk-${{ github.sha }}
          path: ukrduzt_app/build/app/outputs/flutter-apk/ukrduzt-*.apk
          if-no-files-found: error
