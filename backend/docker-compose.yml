services:
  ukrduzt-schedule-api:
    build: .
    image: ukrduzt-schedule-api:latest
    container_name: ukrduzt-schedule-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    environment:
      - PYTHONUNBUFFERED=1
      # Cadence of the background portal sync. Lower it in staging for faster
      # feedback during parser changes; keep 3600 in production.
      - SYNC_INTERVAL_SECONDS=3600
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
