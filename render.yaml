# Render Blueprint for the UkrDUZT schedule API.
#
# This file is what fixes the "COPY requirements.txt: not found" build error
# shown when the service's *Base Directory* (Root Directory) was changed in the
# Render dashboard. The Dockerfile and requirements.txt live under `backend/`,
# not at the repo root, so the build context MUST be `backend/`. Setting
# `rootDir` here (in code, version-controlled) overrides whatever the dashboard
# field says, and applies on every deploy — including manual "Base directory
# updated" triggers.
#
# Deploy from the repo root: Render reads render.yaml at the root and uses the
# `rootDir` below as the build context, so `COPY requirements.txt .` resolves
# to backend/requirements.txt as intended.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ukrduzt-schedule-api
    # Build context for the Dockerfile. The Dockerfile does
    # `COPY requirements.txt .` and `COPY . .`, both of which are relative to
    # this directory. Must be `backend/` — root would miss requirements.txt.
    rootDir: backend/
    runtime: docker
    # Render builds the image from the Dockerfile found inside rootDir.
    dockerfilePath: ./Dockerfile
    plan: free
    # A stable, unique URL for the API.
    domains:
      - ukrduzt-schedule-api.onrender.com
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: TZ
        value: Europe/Kyiv
      # Sync scheduler interval (seconds). The default in code is 3600; keep it
      # explicit so a code change can't silently stretch the cadence.
      - key: SYNC_INTERVAL_SECONDS
        value: "3600"
      # Optional: set SYNC_TOKEN to require X-Sync-Token on /api/v1/sync and
      # the /api/v1/admin/* manual-upload endpoints. Leave unset for open dev.
      # - key: SYNC_TOKEN
      #   sync: false
